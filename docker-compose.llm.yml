# Bundled LLM runtime (LLM_RUNTIME=bundled). Layered onto the base stack via
#   COMPOSE_FILE=docker-compose.yml:docker-compose.llm.yml   (set by deploy/install.sh)
# CPU by default (SPEC §10 "Cliente entry"); add docker-compose.gpu.yml for a GPU.
# With LLM_RUNTIME=external this file is left out and api/worker talk to LLM_BASE_URL.
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-./data}/models:/root/.ollama
    environment:
      # Ollama sizes the context from VRAM (4096 on cards under 24 GB). A RAG prompt is up to
      # 6000 tokens of excerpts (rag.MAX_CONTEXT_TOKENS) plus system prompt, history and the
      # answer; past the limit Ollama silently drops the start of the prompt. See ADR 0005.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-12288}
      # Keep the model loaded: Ollama's default unloads it after 5 idle minutes, and the next
      # question then waits for the reload (17-89 s measured on an RTX 3070 Ti). Safe because the
      # GPU is the LLM's alone unless docker-compose.gpu-worker.yml is layered (>= 12 GB cards).
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
